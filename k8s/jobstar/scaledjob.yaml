apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: solver
  namespace: jobstar
spec:
  pollingInterval: 5
  maxReplicaCount: 20
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  scalingStrategy:
    strategy: accurate
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app: solver
          component: job-runner
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        serviceAccountName: solver
        restartPolicy: Never
        hostUsers: false
        volumes:
          - name: logs
            emptyDir: { sizeLimit: 2Gi }
          - name: containers
            emptyDir: { sizeLimit: 20Gi }
          - name: alloy-config
            configMap:
              name: solver-alloy
        initContainers:
          - name: log-shipper
            image: grafana/alloy:v1.18.1
            restartPolicy: Always
            args:
              - run
              - /etc/alloy/config.alloy
              - --storage.path=/tmp/alloy
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef: { fieldPath: metadata.name }
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef: { fieldPath: metadata.namespace }
              - name: LOKI_URL
                value: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
            volumeMounts:
              - { name: logs, mountPath: /var/log/job, readOnly: true }
              - { name: alloy-config, mountPath: /etc/alloy }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 256Mi }
        containers:
          - name: solver
            image: ghcr.io/proskul/sabrina-solver:6bc9826
            env:
              - name: APP_ENV
                value: "production"
              - name: POD_NAME
                valueFrom:
                  fieldRef: { fieldPath: metadata.name }
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef: { fieldPath: metadata.namespace }
              - name: LOG_DIR
                value: /var/log/job
              - name: AMQP_URL
                valueFrom:
                  secretKeyRef: { name: app-secrets, key: rabbitmq-amqp-url }
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef: { name: app-secrets, key: database-url }
            volumeMounts:
              - { name: logs, mountPath: /var/log/job }
              - { name: containers, mountPath: /home/runner/.local/share/containers }
            resources:
              requests: { cpu: 250m, memory: 256Mi }
              limits: { cpu: "2", memory: 4Gi }
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: true
              seccompProfile:
                type: Unconfined
              appArmorProfile:
                type: Unconfined
  triggers:
    - type: rabbitmq
      metadata:
        queueName: jobs
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-auth