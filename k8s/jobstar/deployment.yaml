apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobstar
  namespace: jobstar
  labels:
    app: jobstar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobstar
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: jobstar
    spec:
      containers:
        - name: api
          image: ghcr.io/proskul/sabrina:ac16e8c
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: RABBITMQ_HOST
              value: "rabbitmq.jobstar.svc.cluster.local:5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-pass
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]