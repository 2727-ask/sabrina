name: Build, Push, and Cleanup

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: jobstar
  MANIFEST: k8s/jobstar/deployment.yaml

# Serialize runs on main so the manifest-bump commit never races another push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - id: image
        run: echo "image=${REGISTRY}/${REPO,,}" >> $GITHUB_OUTPUT
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in manifest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "s|image: ghcr.io/.*jobstar:.*|image: ${IMAGE}:${TAG}|g" "$MANIFEST"
            git add "$MANIFEST"
            if git diff --staged --quiet; then
              echo "Manifest already at ${TAG}; nothing to push."
              exit 0
            fi
            git commit -m "chore: bump image to ${TAG} [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed manifest bump to ${TAG}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push manifest bump after retries." >&2
          exit 1

  cleanup-old-versions:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old container versions
        uses: actions/delete-package-versions@v5
        with:
          owner: proskul
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false