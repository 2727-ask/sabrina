name: Build, Push, and Cleanup

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'

env:
  REGISTRY: ghcr.io

# Serialize runs on main so the manifest-bump commit never races another push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
      solver_image: ${{ steps.image.outputs.solver_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - id: image
        run: |
          echo "image=${REGISTRY}/${REPO,,}" >> $GITHUB_OUTPUT
          echo "solver_image=${REGISTRY}/${REPO,,}-solver" >> $GITHUB_OUTPUT
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push solver image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.solver
          push: true
          tags: |
            ${{ steps.image.outputs.solver_image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.solver_image }}:latest
          cache-from: type=gha,scope=solver
          cache-to: type=gha,mode=max,scope=solver

      - name: Update image tags in manifests
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOLVER_IMAGE: ${{ steps.image.outputs.solver_image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ -f k8s/jobstar/deployment.yaml ]; then
              sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|g" k8s/jobstar/deployment.yaml
              git add k8s/jobstar/deployment.yaml
            fi
            if [ -f k8s/jobstar/scaledjob.yaml ]; then
              sed -i "s|image: ${SOLVER_IMAGE}:.*|image: ${SOLVER_IMAGE}:${TAG}|g" k8s/jobstar/scaledjob.yaml
              git add k8s/jobstar/scaledjob.yaml
            fi

            if git diff --staged --quiet; then
              echo "Manifests already at ${TAG}; nothing to push."
              exit 0
            fi
            git commit -m "chore: bump images to ${TAG} [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed manifest bump to ${TAG}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push manifest bump after retries." >&2
          exit 1

  cleanup-old-versions:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        suffix: ["", "-solver"]
    steps:
      - name: Delete old container versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ github.event.repository.name }}${{ matrix.suffix }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false